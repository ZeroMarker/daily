name: Publish magazine to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'content/**/script.json'
      - 'site/**'
      - 'scripts/build_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Render daily release]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build magazine, daily reports and videos
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy magazine
        id: deployment
        uses: actions/deploy-pages@v4
