name: Auto publish daily

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-daily
  cancel-in-progress: false

env:
  NEWS_TIMEZONE: Asia/Shanghai

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RSS client
        run: python -m pip install requests
      - name: Test content automation
        run: python -m unittest discover -s tests
      - name: Fetch and generate today's report
        run: |
          python scripts/fetch.py
          python scripts/generate_news.py
          python scripts/validate_content.py
      - name: Commit daily content and push version tag
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python scripts/publish_content.py

  release:
    needs: generate
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.generate.outputs.tag }}
    secrets: inherit
